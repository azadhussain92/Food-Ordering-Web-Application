{% extends 'base.html' %}

{% block content %}
<style>
    body{
        background-color: white;
    }
.navbar {
    display: flex;
    align-items: center;
    padding: 15px 30px;
    background-color: #eae7e7;
}
.home-content h1{
        text-decoration: solid;
        text-shadow: 3px;
        /* font-style: oblique; */
        font-weight: 700;
        text-align: center;
        margin-top: 30px;
    }

.search-box{
    margin: 30px auto;
    max-width: 700px;
    margin-right: auto;
}
.search-box input{
    height: 50px;
    border-radius: 25px;
    padding: 10px 25px;
    border: 1px solid #ccc;
}

.food-section {
    margin: 30px;
}

.food-section h2 {
    margin-bottom: 20px;
}

.food-container {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 20px;
    padding: 20px;

    overflow-x: auto;
    /* overflow-y: hidden; */
}
.food-card {
    flex: 0 0 180px;

    width: 180px;
    min-width: 180px;

    background: white;
    border-radius: 15px;
    padding: 10px;

    text-align: center;
    box-shadow: 0px 2px 8px #ccc;
}

.food-card img {
    width: 160px;
    height: 130px;

    object-fit: cover;
    border-radius: 12px;
}

.restaurant-section {
        margin: 30px;
    }

    .restaurant-container{
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap: 20px;
        align-items: start;
    }
    .restaurant-card{
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0px 2px 8px #ccc;
    }
    .restaurant-card img{
        width: 100%;
        height: 180px;
        object-fit: cover;
    }

</style>

<!-- REGESTER RESTRAUNTS -->
<hr>
<div class="restaurant-section">
    <h2>REGESTER RESTRAUNTS</h2>
    <div class="restaurant-container">

        {% for vendor in vendors %}

        <a href="{% url 'Rest' vendor.id %}" style="text-decoration:none; color:inherit;">
            <div class="restaurant-card">

                {% if vendor.res_image %}
                    <img src="{{ vendor.res_image.url }}" alt="{{ vendor.RestruntName }}">

                {% else %}
                     <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4" alt="No image">

                {% endif %}
                <div class="restaurant-info">

                    <h3>{{ vendor.RestruntName }}</h3>
                    <p>{{ vendor.res_address }}</p>
                </div>

            </div>

        {% empty %}
        <p>No registered restaurants yet.</p>

        {% endfor %}
        </a>
    </div>
</div>
