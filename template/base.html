<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        .cart-icon{
            position: absolute;
            right: 30px;
            font-size: 32px;
            color: black;
            text-decoration: none;
        }
        .cart-icon:hover{
            color: blue;
        }
        .home-nav{
            padding-left: 30px;
        }
        .nav-link{
            color: black;
            font-size: 20px;
            font-weight: bold;
        }
        .nav-link:hover{
            background-color: blue;
            color: white;
            border-radius: 10px;
        }
    </style>

</head>
<body><br>
    <div class="navbar-wrapper">

        <!-- Here  will show the cart icon in home Page -->
        {% if user.is_authenticated %}
            <a href="{% url 'cart' %}" class="cart-icon">
                <i class="bi bi-cart3"></i>

            {% if cart_count > 0 %}
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                {{ cart_count }}
            </span>
            {% endif %}
            </a>

        {% endif %}

    <ul class="nav justify-content-center">
        
    <!-- <ul class="nav {% if request.resolver_match.url_name == 'home' %}justify-content-start home-nav{% else %}justify-content-center{% endif %}"> -->
        {% if user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link active"  href="{% url 'home' %}">Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'profile'%}">profile</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'logout' %}">Logout</a>
            </li>

        {% else %}
            <li class="nav-item">
                <a class="nav-link" href="{% url 'regester' %}">UserRegestraion</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'vendor_register' %}">VendorRegestration</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'login' %}">Login</a>
            </li>

        {% endif %}   
    </ul>

    {% block content %}

    {% endblock%}
    
</body>
</html>
